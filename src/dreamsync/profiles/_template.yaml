# DreamSync Color Profile Template
# Copy this file and customize to create your own profile.
#
# Usage:
#   dreamsync govee-live --device ... --duration 120 --profile my_profile.yaml
#   dreamsync session --config devices.yaml --profile my_profile
#
# Profile names without a path are resolved:
#   1. As an explicit file path
#   2. In the current directory (with .yaml extension)
#   3. In the built-in profiles directory

name: "My Custom Profile"           # required, displayed in profile listings
description: "Describe your vibe"   # optional
author: "your-name"                 # optional
tags: ["custom"]                    # optional, for filtering/search
version: 1                          # must be 1

# Named palettes: 3-8 hex colors each
# These are local to this profile and referenced by mood configs below.
# You can also reference built-in palette names: warm, cool, sunset, vivid,
# pastel, neon, fire, ice
palettes:
  my_primary: ["#ff4400", "#ff8800", "#ffcc00", "#ff6600"]
  my_accent:  ["#0044ff", "#0088ff", "#00ccff", "#0066ff"]
  my_intense: ["#ff00ff", "#00ffff", "#ffff00"]

# EQ routing rules (optional)
# Route specific spectral bands to lighting changes. Rules can live at the
# profile level or inside an individual mood and are merged together.
# Valid bands: sub, kick, bass, low_mid, mid, presence, air
# Valid "when" values: dominant, enter, drop, sustain, exit, lift, swell
# Optional fields:
#   render_mode: built-in render mode name such as pulse, wave, breathe, scroll
#   color_bias:  hex color used to tint the active palette
#   intensity_boost: additive cue intensity boost
# eq_routes:
#   - band: "bass"
#     when: "enter"
#     render_mode: "pulse"
#     color_bias: "#ff6600"
#     intensity_boost: 0.2
#   - band: "presence"
#     when: "lift"
#     render_mode: "scroll"
#     color_bias: "#00ccff"

# Instrument routing rules (optional)
# Route heuristic instrument proxies to lighting and spatial behavior.
# Valid instruments: drums, bass, vocals, harmonic, percussive
# Valid "when" values: dominant, present, enter, drop
# Useful pan-aware fields:
#   spatial_preset: choose a spatial behavior such as blend_left_to_right
#   pan_follow:     0.0-1.0, how strongly stereo pan shifts the route left/right
#   width_scale:    expands or narrows placement based on detected pan width
# instrument_routes:
#   - instrument: "vocals"
#     when: "dominant"
#     render_mode: "gradient"
#     color_bias: "#cceeff"
#     spatial_preset: "blend_left_to_right"
#     pan_follow: 0.7
#     width_scale: 1.3
#   - instrument: "harmonic"
#     when: "present"
#     render_mode: "wave"
#     spatial_preset: "blend_front_to_back"
#     pan_follow: 0.35
#     width_scale: 1.2

# Per-mood configuration — all 4 moods must be defined
moods:
  chill:
    palettes: ["my_primary"]          # list of palette names to randomly pick from
    # effects:                        # optional: override the effect pool for this mood
    #   - name: "wave_drift"          # must be a valid built-in effect name
    #     weight: 3.0                 # higher weight = more likely to be picked
    #   - name: "slow_breathe"
    #     weight: 2.0
    # params:                         # optional: merged onto active effect's params
    #   wave_rate_mult: 0.3

  groove:
    palettes: ["my_primary", "my_accent"]
    # eq_routes:
    #   - band: "bass"
    #     when: "dominant"
    #     color_bias: "#ff8800"
    # instrument_routes:
    #   - instrument: "vocals"
    #     when: "present"
    #     pan_follow: 0.55

  hype:
    palettes: ["my_intense", "my_accent"]

  drop:
    palettes: ["my_intense"]
    # params:
    #   pulse_decay: 3.5
    # eq_routes:
    #   - band: "sub"
    #     when: "enter"
    #     render_mode: "pulse"
    #     intensity_boost: 0.25

# Transition rules (optional)
# Force a specific palette when transitioning between moods.
# transitions:
#   - from: "chill"
#     to: "groove"
#     palette: "my_primary"

# Override the effect cycle interval (default: 16 seconds)
# cycle_interval: 24.0
