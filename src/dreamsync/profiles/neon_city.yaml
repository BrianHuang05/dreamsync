name: "Neon City"
description: "Hot pinks, electric blues, and lime greens — cyberpunk nightscape"
author: "dreamsync"
tags: ["neon", "cyberpunk", "night"]
version: 1

palettes:
  hot_pink:   ["#ff0066", "#ff0099", "#ff33aa", "#cc0055", "#ff1177", "#ff44bb"]
  cyber_blue: ["#0088ff", "#00aaff", "#00ccff", "#0066dd", "#3399ff", "#66bbff"]
  lime:       ["#88ff00", "#aaff00", "#ccff00", "#66dd00", "#99ff33", "#bbff44"]

moods:
  chill:
    palettes: ["cyber_blue"]
    params:
      wave_rate_mult: 0.35
  groove:
    palettes: ["hot_pink", "cyber_blue"]
  hype:
    palettes: ["hot_pink", "lime"]
  drop:
    palettes: ["lime", "hot_pink"]
    params:
      pulse_decay: 3.5

transitions:
  - from: "groove"
    to: "hype"
    palette: "hot_pink"

cycle_interval: 12.0
