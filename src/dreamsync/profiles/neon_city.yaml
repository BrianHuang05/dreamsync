name: "Neon City"
description: "Hot pinks, electric blues, and lime greens — cyberpunk nightscape"
author: "dreamsync"
tags: ["neon", "cyberpunk", "night"]
version: 1

palettes:
  hot_pink:   ["#ff0066", "#ff0099", "#ff33aa", "#cc0055", "#ff1177", "#ff44bb"]
  cyber_blue: ["#0088ff", "#00aaff", "#00ccff", "#0066dd", "#3399ff", "#66bbff"]
  lime:       ["#88ff00", "#aaff00", "#ccff00", "#66dd00", "#99ff33", "#bbff44"]

eq_routes:
  - band: "bass"
    when: "enter"
    render_mode: "pulse"
    color_bias: "#ff1177"
    intensity_boost: 0.2
  - band: "presence"
    when: "lift"
    render_mode: "scroll"
    color_bias: "#00ccff"

instrument_routes:
  - instrument: "vocals"
    when: "dominant"
    color_bias: "#cceeff"
    render_mode: "gradient"
    spatial_preset: "blend_left_to_right"
    pan_follow: 0.75
    width_scale: 1.35
  - instrument: "harmonic"
    when: "present"
    color_bias: "#66bbff"
    render_mode: "wave"
    spatial_preset: "blend_front_to_back"
    pan_follow: 0.4
    width_scale: 1.25

moods:
  chill:
    palettes: ["cyber_blue"]
    params:
      wave_rate_mult: 0.35
  groove:
    palettes: ["hot_pink", "cyber_blue"]
  hype:
    palettes: ["hot_pink", "lime"]
  drop:
    palettes: ["lime", "hot_pink"]
    params:
      pulse_decay: 3.5
    eq_routes:
      - band: "sub"
        when: "enter"
        render_mode: "pulse"
        color_bias: "#88ff00"
        intensity_boost: 0.25

transitions:
  - from: "groove"
    to: "hype"
    palette: "hot_pink"

cycle_interval: 12.0
