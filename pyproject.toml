[project]
name = "dreamsync-music-sync"
version = "1.0.0"
description = "Local audio-reactive control for Govee DreamView/LAN devices."
readme = "README.md"
requires-python = ">=3.10.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "sounddevice>=0.4",
]

[project.optional-dependencies]
stream = ["sounddevice>=0.4"]
ble = ["bleak>=0.21"]
yaml = ["pyyaml>=6.0"]
session = ["bleak>=0.21", "pyyaml>=6.0", "httpx>=0.27"]
spotify = ["httpx>=0.27"]
gui = ["PySide6>=6.7"]

[tool.setuptools.package-data]
"dreamsync" = ["profiles/*.yaml"]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["dev/tests"]

[tool.ruff]
line-length = 100
