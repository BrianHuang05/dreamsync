# DreamSync Device Configuration Template
#
# Copy this file to devices.yaml and edit to match your device fleet.
# Used by: python -m dreamsync session --config devices.yaml
#
# Field reference:
#   name        - Human-readable label (any string)
#   address     - IP address (LAN) or BLE MAC address (AA:BB:CC:DD:EE:FF)
#   type        - "lan", "ble", or "auto" (auto-detect from address format)
#   segments    - Number of addressable LED segments (LAN only, default 15)
#   transport   - LAN protocol: "ptreal" (per-segment), "razer" (DreamView), "colorwc" (whole-strip fallback)
#   protocol    - BLE protocol: "segment" (strips/panels) or "bulb" (H6006 family)
#   role        - "primary" (full-FPS reactive) or "accent" (mood-follower)
#   max_fps     - Max frame rate for this device (default 5.0 for BLE, 30 for LAN)
#   x_position  - Optional spatial alias: "left", "center", "right"
#   y_position  - Optional spatial alias: "front", "center", "back"
#   x / y       - Optional normalized coordinates (-1.0 to 1.0) instead of aliases
#   orientation - "left_to_right" (default) or "right_to_left"
#   weight      - Relative emphasis weight for spatial mapping (default 1.0)

devices:
  # --- LAN devices -----------------------------------------------------------
  # LAN devices use UDP on your local network. Fastest option (~1-5ms latency).
  # Find IPs with: python -m dreamsync govee-scan

  - name: "My LED Strip"
    address: "10.0.0.100"
    type: lan
    segments: 15
    transport: ptreal           # ptreal for most strips, razer for DreamView
    role: primary
    x_position: left
    y_position: front
    orientation: left_to_right
    weight: 1.0

  # - name: "My DreamView"
